[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energyplus-viewfactors"
dynamic = ["version"]
description = "Calculate view factors for EnergyPlus"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["energyplus", "epjson", "view3d", "view-factors"]
authors = [
  { name = "Jason W. DeGraw", email = "jason.degraw@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "click",
  "pathvalidate",
  "tkmacos ; platform_system == \"Darwin\"",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.urls]
Documentation = "https://github.com/building-physics/energyplus-viewfactors#readme"
Issues = "https://github.com/building-physics/energyplus-viewfactors/issues"
Source = "https://github.com/building-physics/energyplus-viewfactors"

[project.scripts]
energyplus-viewfactors = "energyplus_viewfactors.cli:energyplus_viewfactors"

[project.gui-scripts]
epvf = "energyplus_viewfactors.gui:epvf"

[tool.hatch.version]
path = "src/energyplus_viewfactors/__about__.py"

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
format = "ruff format {args:.}"
lint = [
  "ruff format --check {args:.}",
  "ruff check {args:.}",
]
test = "pytest {args}"
types = "mypy {args:src/energyplus_viewfactors tests}"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "scripts/ex.py",
  "scripts/launch.py",
  "scripts/test.py",
  "src/energyplus_viewfactors/finder.py",
  "src/energyplus_viewfactors/util.py",
]

[tool.ruff.format]
exclude = ["src/energyplus_viewfactors/interface.py"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/energyplus_viewfactors/interface.py" = ["F401", "I001", "UP015"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
warn_unused_configs = true

[tool.coverage.run]
source_pkgs = ["energyplus_viewfactors"]
branch = true
omit = [
  "src/energyplus_viewfactors/__about__.py",
]

[tool.coverage.paths]
energyplus_viewfactors = [
  "src/energyplus_viewfactors",
  "*/energyplus-viewfactors/src/energyplus_viewfactors",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
